# render.yaml - Infrastructure as Code for LeakShield
# Deploy backend, worker, and databases to Render.com.

databases:
  - name: leakshield-db
    databaseName: leakshield_db
    user: leakshield
    plan: free

services:
  # 1. Node.js Backend (Web Service)
  - type: web
    name: leakshield-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Redis — Set in Render Dashboard from Upstash connection string
      - key: REDIS_URL
        sync: false
      # Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: leakshield-db
          property: connectionString
      # Frontend URL (Vercel)
      - key: FRONTEND_URL
        value: "https://leak-shield-one.vercel.app"
      # Backend URL (this service — used for OAuth redirect_uri)
      - key: BACKEND_URL
        sync: false   # Set this to your Render backend URL e.g. https://leakshield-backend.onrender.com
      # App URL for Slack/GitHub status links
      - key: APP_URL
        value: "https://leak-shield-one.vercel.app"
      # JWT — auto-generated
      - key: JWT_SECRET
        generateValue: true
      # OAuth (Set these in Render Dashboard)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # 2. Python Detection Engine (Background Worker as Web Service)
  - type: web
    name: leakshield-worker
    env: python
    buildCommand: cd detection-engine && pip install -r requirements.txt
    startCommand: cd detection-engine && python worker.py
    envVars:
      # Redis — Set in Render Dashboard from Upstash connection string
      - key: REDIS_URL
        sync: false
      # Postgres — needed to store findings
      - key: DATABASE_URL
        fromDatabase:
          name: leakshield-db
          property: connectionString
      # Backend URL — for calling /api/webhooks/scan-complete
      - key: BACKEND_URL
        sync: false   # Set this to your Render backend URL
      - key: PORT
        value: 10001
