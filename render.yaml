# render.yaml - Infrastructure as Code for LeakShield
# Deploy backend, worker, and databases to Render.com.

databases:
  - name: leakshield-db
    databaseName: leakshield_db
    user: leakshield
    plan: free

services:
  # 1. Redis Cache & Queue
  - type: redis
    name: leakshield-redis
    ipAllowList: [] # internal only
    plan: free

  # 2. Node.js Backend (Web Service)
  - type: web
    name: leakshield-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: redis
          name: leakshield-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: leakshield-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://leak-shield-one.vercel.app"
      # Required API Keys (Set these securely in the Render Dashboard)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 3. Python Detection Engine (Background Worker modified as Web Service)
  - type: web
    name: leakshield-worker
    env: python
    buildCommand: cd detection-engine && pip install -r requirements.txt
    startCommand: cd detection-engine && python worker.py
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: leakshield-redis
          property: connectionString
